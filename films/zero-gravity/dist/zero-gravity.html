<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero Gravity and No Attraction</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
// ---- src/core.js
/*
 * core.js : the FILM runtime.
 *
 * Load order everywhere: core.js, lib.js, timeline.js, scenes (sorted), music.js, player.js.
 *
 * Defines window.FILM: the scene registry, the timeline reader, renderFrame(T),
 * transitions between shots, an optional per-shot grade, and the global post-processing (boiling grain).
 *
 * Rules for scene code (see docs/CONTRACT.md):
 *   - Draw only from (t, info). No state carried between frames.
 *   - Use ctx.save()/ctx.restore(). Never call ctx.setTransform/resetTransform with
 *     absolute values: the base transform carries the render scale (FILM.S).
 *     If you really need the base transform back, call FILM.baseTransform(ctx).
 *   - Randomness only from FILM.lib.rng(seed) / FILM.lib.hash(...).
 *   - FILM.lib, FILM.lib.pal and FILM.lib.ease are frozen. Copy before changing anything.
 */
(function () {
  'use strict';

  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = (root.FILM = root.FILM || {});

  const DEFAULT_W = 1080;
  const DEFAULT_H = 1920;

  function frameDim(v, fallback) {
    const n = Number(v);
    return n > 0 && isFinite(n) ? n : fallback;
  }

  // Read at use time: core.js loads before timeline.js.
  function frameSize() {
    const tl = FILM.TIMELINE;
    return {
      w: frameDim(tl && tl.width, DEFAULT_W),
      h: frameDim(tl && tl.height, DEFAULT_H),
    };
  }

  Object.defineProperty(FILM, 'W', {
    get() { return frameSize().w; },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(FILM, 'H', {
    get() { return frameSize().h; },
    enumerable: true,
    configurable: true,
  });

  // Title-safe rectangle in frame pixels. Keep in step with tools/common.cjs safeArea.
  // 1080×1920 keeps the Shorts/Reels box. 16:9, 1:1 and any other size use 90% of the frame, centred.
  FILM.safeArea = function safeArea(w, h) {
    const f = frameSize();
    const fw = frameDim(w == null ? f.w : w, DEFAULT_W);
    const fh = frameDim(h == null ? f.h : h, DEFAULT_H);
    if (fw === DEFAULT_W && fh === DEFAULT_H) return { x0: 60, y0: 220, x1: 940, y1: 1540 };
    return { x0: fw * 0.05, y0: fh * 0.05, x1: fw * 0.95, y1: fh * 0.95 };
  };

  FILM.FPS = 24;
  FILM.BOIL_FPS = 12;
  FILM.S = 1; // render scale: device pixels per logical pixel
  FILM.registry = {}; // id -> scene definition
  FILM.registered = []; // [{ id, file }] in registration order
  FILM.errors = []; // drawing errors collected by renderFrame (tools clear and read this)
  FILM.strict = false; // when true, renderFrame rethrows scene errors after recording them
  FILM.only = null; // shot id when a tool loaded only that shot's file (snap --only); transitions from an unloaded shot are skipped
  FILM.canvas = null;
  FILM.ctx = null;

  // Global time of the frame being drawn. Read-only for scenes (FILM.lib.T reads it); core sets it before each draw.
  let frameT = 0;
  Object.defineProperty(FILM, 'frameT', { get: () => frameT, enumerable: true, configurable: false });

  const EPS = 1e-6;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

  // Small self-contained hash so core never depends on lib being healthy.
  function ihash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------------------------------------------------------------------------
  // Scene registry
  // ---------------------------------------------------------------------------

  FILM.scene = function scene(def) {
    const doc = typeof document !== 'undefined' ? document : null;
    const src = doc && doc.currentScript && doc.currentScript.src ? doc.currentScript.src : '';
    const file = src ? decodeURIComponent(src.split('?')[0].split('/').pop()) : '';
    if (!def || typeof def.id !== 'string' || !def.id || typeof def.draw !== 'function') {
      const msg = `FILM.scene() needs { id: string, draw: function }${file ? ' (in ' + file + ')' : ''}`;
      FILM.errors.push({ T: null, shot: def && def.id, message: msg, file });
      if (typeof console !== 'undefined') console.error(msg);
      return def;
    }
    if (FILM.registry[def.id]) {
      const prev = FILM.registry[def.id].__file || '?';
      const msg = `duplicate scene id '${def.id}' registered by ${file || '?'} (already registered by ${prev})`;
      FILM.errors.push({ T: null, shot: def.id, message: msg, file });
      if (typeof console !== 'undefined') console.error(msg);
    }
    def.__file = file;
    FILM.registry[def.id] = def;
    FILM.registered.push({ id: def.id, file });
    return def;
  };

  // ---------------------------------------------------------------------------
  // Timeline
  // ---------------------------------------------------------------------------

  function modeOf(shot) {
    const m = String((shot && shot.mode) || 'illustrated').toLowerCase();
    if (m === 'none' || m === 'raw') return 'none';
    if (m.indexOf('schem') >= 0 || m.indexOf('blue') >= 0) return 'schematic';
    return 'illustrated';
  }
  FILM.modeOf = modeOf;

  function normTransition(tr) {
    if (!tr) return null;
    if (typeof tr === 'string') tr = { kind: tr };
    const kind = String(tr.kind || tr.type || 'cut').toLowerCase();
    const dur = Number(tr.dur != null ? tr.dur : tr.duration != null ? tr.duration : 0.25);
    return Object.assign({}, tr, { kind, dur: Math.max(0, dur) });
  }

  // Accepts start/end, start/dur, t0/t1, from/to; shots with only a dur chain after the previous one.
  // Writes normalised start, end and dur back onto each shot entry.
  let prepared = null;
  function prepare() {
    const tl = FILM.TIMELINE;
    if (!tl) throw new Error('FILM.TIMELINE is not defined: src/timeline.js did not load');
    const shots = tl.shots || [];
    if (prepared && prepared.tl === tl && prepared.src === shots && prepared.n === shots.length) return prepared;
    let cursor = 0;
    const out = [];
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      const pick = (...keys) => {
        for (const k of keys) if (s[k] != null && isFinite(Number(s[k]))) return Number(s[k]);
        return null;
      };
      let start = pick('start', 't0', 'from', 'in');
      if (start == null) start = cursor;
      let end = pick('end', 't1', 'to', 'out');
      if (end == null) {
        const d = pick('dur', 'duration', 'length');
        end = d != null ? start + d : start;
      }
      s.start = start;
      s.end = end;
      s.dur = end - start;
      s.index = i;
      s.transitionIn = normTransition(s.transitionIn);
      cursor = end;
      out.push(s);
    }
    const duration = tl.duration != null ? Number(tl.duration) : out.length ? out[out.length - 1].end : 0;
    prepared = { tl, src: shots, n: shots.length, shots: out, duration };
    return prepared;
  }
  FILM.prepare = prepare;

  Object.defineProperty(FILM, 'DURATION', {
    get() { return FILM.TIMELINE ? prepare().duration : 0; },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(FILM, 'FRAMES', {
    get() { return Math.round(FILM.DURATION * FILM.FPS); },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(FILM, 'shots', {
    get() { return FILM.TIMELINE ? prepare().shots : []; },
    enumerable: true,
    configurable: true,
  });

  function shotIndexAt(T) {
    const { shots } = prepare();
    if (!shots.length) return -1;
    for (let i = 0; i < shots.length; i++) {
      if (T < shots[i].end - EPS) return i;
    }
    return shots.length - 1;
  }
  FILM.shotIndexAt = shotIndexAt;
  FILM.activeShot = function activeShot(T) {
    const i = shotIndexAt(T);
    return i < 0 ? null : prepare().shots[i];
  };
  FILM.frameTime = (i) => i / FILM.FPS;
  FILM.shotById = (id) => prepare().shots.find((s) => s.id === id) || null;

  // ---------------------------------------------------------------------------
  // Canvas
  // ---------------------------------------------------------------------------

  function makeCanvas(w, h) {
    if (typeof document !== 'undefined') {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }
    return new OffscreenCanvas(w, h);
  }
  FILM.makeCanvas = makeCanvas;

  let ctxAttrs = {};
  FILM.mount = function mount(canvas, opts) {
    opts = opts || {};
    const S = opts.scale && opts.scale > 0 ? opts.scale : 1;
    FILM.S = S;
    canvas.width = Math.max(2, Math.round((FILM.W * S) / 2) * 2);
    canvas.height = Math.max(2, Math.round((FILM.H * S) / 2) * 2);
    ctxAttrs = { alpha: false };
    if (opts.readback) ctxAttrs.willReadFrequently = true;
    FILM.canvas = canvas;
    FILM.ctx = canvas.getContext('2d', ctxAttrs);
    layers.length = 0;
    return FILM.ctx;
  };

  FILM.baseTransform = function baseTransform(ctx) {
    const c = ctx.canvas;
    ctx.setTransform(c.width / FILM.W, 0, 0, c.height / FILM.H, 0, 0);
  };

  const layers = [];
  function layer(i) {
    const w = FILM.canvas.width;
    const h = FILM.canvas.height;
    let L = layers[i];
    if (!L || L.canvas.width !== w || L.canvas.height !== h) {
      if (window.__cvAudit) window.__cvNextKey = 'layer-' + i;
      const canvas = makeCanvas(w, h);
      if (window.__cvAudit) window.__cvNextKey = null;
      L = layers[i] = { canvas, ctx: canvas.getContext('2d', ctxAttrs) };
    }
    return L;
  }

  // clear=true wipes the bitmap as well (ctx.reset where available).
  // clear=false unwinds any save() a scene left open and restores default state, keeping pixels.
  function resetCtx(ctx, clear) {
    if (clear && typeof ctx.reset === 'function') {
      ctx.reset();
    } else {
      for (let i = 0; i < 64; i++) ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'none';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.shadowColor = 'rgba(0,0,0,0)';
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      ctx.lineWidth = 1;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
      ctx.miterLimit = 10;
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.beginPath();
    }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  // ---------------------------------------------------------------------------
  // Global post: boiling grain
  // ---------------------------------------------------------------------------

  const TILE = 512;
  const VARIANTS = 4;
  const grainCache = {};

  function grainTile(mode, v) {
    const key = mode + v;
    if (grainCache[key]) return grainCache[key];
    const c = makeCanvas(TILE, TILE);
    const g = c.getContext('2d');
    const img = g.createImageData(TILE, TILE);
    const d = img.data;
    const seed = (mode === 'schematic' ? 9001 : 4242) + v * 131;
    for (let y = 0; y < TILE; y++) {
      for (let x = 0; x < TILE; x++) {
        const i = (y * TILE + x) * 4;
        const n = ihash(x, y, seed);
        // paper tooth: soft 2-3 px clumps from a wrapped coarse cell, plus a little per-pixel noise
        const cx0 = (x >> 2) % (TILE >> 2), cy0 = (y >> 2) % (TILE >> 2);
        const fx = ((x & 3) + 0.5) / 4, fy = ((y & 3) + 0.5) / 4;
        const q = TILE >> 2;
        const c00 = ihash(cx0, cy0, seed + 7), c10 = ihash((cx0 + 1) % q, cy0, seed + 7);
        const c01 = ihash(cx0, (cy0 + 1) % q, seed + 7), c11 = ihash((cx0 + 1) % q, (cy0 + 1) % q, seed + 7);
        const cn = (c00 * (1 - fx) + c10 * fx) * (1 - fy) + (c01 * (1 - fx) + c11 * fx) * fy;
        if (mode === 'schematic') {
          const v2 = n * 0.7 + cn * 0.3;
          if (v2 > 0.62) {
            d[i] = 214; d[i + 1] = 220; d[i + 2] = 255;
            d[i + 3] = Math.min(255, (v2 - 0.62) * 2.6 * 50);
          } else if (v2 < 0.3) {
            d[i] = 2; d[i + 1] = 3; d[i + 2] = 12;
            d[i + 3] = (0.3 - v2) * 3.3 * 60;
          }
        } else {
          const v2 = n * 0.35 + cn * 0.65;
          if (v2 > 0.56) {
            d[i] = 58; d[i + 1] = 38; d[i + 2] = 22;
            d[i + 3] = Math.min(255, (v2 - 0.56) * 2.27 * 34);
          } else if (v2 < 0.36) {
            d[i] = 255; d[i + 1] = 250; d[i + 2] = 236;
            d[i + 3] = (0.36 - v2) * 2.8 * 30;
          }
          // rare dark specks
          if (n > 0.99965) { d[i] = 40; d[i + 1] = 26; d[i + 2] = 16; d[i + 3] = 120; }
        }
      }
    }
    g.putImageData(img, 0, 0);
    grainCache[key] = c;
    return c;
  }

  function postShot(ctx, shot, def, T) {
    const mode = modeOf(shot);
    if (mode === 'none') return;
    if (FILM.post === false) return; // tools measure a bare frame; never set in the shipped player
    let cfg = def && def.post !== undefined ? def.post : shot.post;
    if (cfg === false) return;
    let amount = 1;
    if (typeof cfg === 'number') amount = cfg;
    else if (cfg && typeof cfg === 'object' && cfg.grain != null) amount = Number(cfg.grain);
    if (!(amount > 0)) return;
    const b = Math.floor(T * FILM.BOIL_FPS + EPS);
    const v = Math.floor(ihash(b, 17, 3) * VARIANTS);
    const tile = grainTile(mode, v);
    const ox = Math.floor(ihash(b, 29, 5) * TILE);
    const oy = Math.floor(ihash(b, 31, 7) * TILE);
    const c = ctx.canvas;
    // the tile is authored in logical pixels: scale it with the render so previews keep the grain size
    const S = c.width / FILM.W;
    const pattern = ctx.createPattern(tile, 'repeat');
    if (Math.abs(S - 1) > EPS && typeof pattern.setTransform === 'function' && typeof DOMMatrix !== 'undefined') {
      pattern.setTransform(new DOMMatrix([S, 0, 0, S, 0, 0]));
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(1, amount);
    ctx.fillStyle = pattern;
    ctx.translate(-ox * S, -oy * S);
    ctx.fillRect(0, 0, c.width + ox * S, c.height + oy * S);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Shot grade: after the drawing, before the grain. multiply / screen / overlay
  // and one radial gradient — never getImageData on the frame. A neutral grade
  // returns before touching the context, so an ungraded shot stays byte-identical.
  // ---------------------------------------------------------------------------

  function gradeNum(g, key, lo, hi) {
    if (!g || g[key] == null) return 0;
    const n = Number(g[key]);
    if (!isFinite(n)) return 0;
    return n < lo ? lo : n > hi ? hi : n;
  }

  function gradeActive(g) {
    if (!g || typeof g !== 'object') return false;
    if (g._mixed) return !!(g.warmth || g.fade || g.vignette || g.paperAge || (g.tints && g.tints.length));
    return !!(g.warmth || g.fade || g.vignette || g.paperAge || (g.tint && g.tintAmount));
  }

  function tintEntries(g) {
    const out = [];
    if (!g || typeof g !== 'object') return out;
    if (g._mixed && Array.isArray(g.tints)) {
      for (const t of g.tints) {
        if (t && typeof t.name === 'string' && t.amount > 0) out.push({ name: t.name, amount: t.amount > 1 ? 1 : t.amount });
      }
      return out;
    }
    const amount = gradeNum(g, 'tintAmount', 0, 1);
    if (typeof g.tint === 'string' && amount > 0) out.push({ name: g.tint, amount });
    return out;
  }

  // p is 0 on the outgoing grade and 1 on the incoming one. Two tint names crossfade
  // as two overlays so the colour does not pop at the midpoint.
  function lerpGrade(a, b, p) {
    if (!gradeActive(a) && !gradeActive(b)) return null;
    const q = 1 - p;
    const warmth = gradeNum(a, 'warmth', -1, 1) * q + gradeNum(b, 'warmth', -1, 1) * p;
    const fade = gradeNum(a, 'fade', 0, 1) * q + gradeNum(b, 'fade', 0, 1) * p;
    const vignette = gradeNum(a, 'vignette', 0, 1) * q + gradeNum(b, 'vignette', 0, 1) * p;
    const paperAge = gradeNum(a, 'paperAge', 0, 1) * q + gradeNum(b, 'paperAge', 0, 1) * p;
    const byName = new Map();
    for (const t of tintEntries(a)) byName.set(t.name, (byName.get(t.name) || 0) + t.amount * q);
    for (const t of tintEntries(b)) byName.set(t.name, (byName.get(t.name) || 0) + t.amount * p);
    const tints = [];
    for (const [name, amount] of byName) if (amount > 0) tints.push({ name, amount });
    if (!warmth && !fade && !vignette && !paperAge && !tints.length) return null;
    return { _mixed: true, warmth, fade, vignette, paperAge, tints };
  }

  // Same p the picture uses, so the grade tracks the dissolve.
  // fade, iris and wipe ease (k + 1) / (n + 1). whip, inkwash and morph step by interior frame.
  function transitionMix(tr, inT) {
    const k = Math.max(0, inT * FILM.FPS);
    const n = tr.dur * FILM.FPS;
    if (!(n > 0)) return 1;
    if (tr.kind === 'flash') return clamp01(k / n);
    if (tr.kind === 'whip' || tr.kind === 'inkwash' || tr.kind === 'morph') {
      return clamp01(k / Math.max(1, interiorFrames(tr.dur)));
    }
    return easeInOutCubic(clamp01((k + 1) / (n + 1)));
  }

  function gradeForShot(shot, T, outgoing) {
    const shots = prepare().shots;
    let prev = null;
    let next = null;
    let tr = null;
    let inT = 0;
    if (outgoing) {
      next = shots[shot.index + 1];
      if (!next) return shot.grade;
      prev = shot;
      tr = next.transitionIn;
      inT = T - next.start;
    } else if (shot.index > 0 && shot.transitionIn && shot.transitionIn.kind !== 'cut' && shot.transitionIn.dur > 0) {
      inT = T - shot.start;
      if (inT < shot.transitionIn.dur - EPS) {
        prev = shots[shot.index - 1];
        next = shot;
        tr = shot.transitionIn;
      }
    }
    if (prev && next && tr && tr.kind !== 'cut' && KINDS[tr.kind] && tr.dur > 0 && inT > -EPS && inT < tr.dur - EPS) {
      return lerpGrade(prev.grade, next.grade, transitionMix(tr, inT));
    }
    return shot.grade;
  }

  function palColor(name) {
    const pal = FILM.lib && FILM.lib.pal;
    const c = pal && name ? pal[name] : null;
    return typeof c === 'string' ? c : null;
  }

  function parseHex(hex) {
    if (!hex || hex[0] !== '#') return null;
    let h = hex.slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h.slice(0, 6), 16);
    if (!isFinite(n)) return null;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Straight-colour source-over, so several uniform washes become one fill.
  function washOver(dst, rgb, srcA) {
    if (!rgb || !(srcA > 0)) return dst;
    if (srcA > 1) srcA = 1;
    if (!dst) return { rgb: rgb, a: srcA };
    const outA = srcA + dst.a * (1 - srcA);
    const k = dst.a * (1 - srcA);
    return {
      rgb: [
        (rgb[0] * srcA + dst.rgb[0] * k) / outA,
        (rgb[1] * srcA + dst.rgb[1] * k) / outA,
        (rgb[2] * srcA + dst.rgb[2] * k) / outA,
      ],
      a: outA,
    };
  }

  function cssRgb(rgb) {
    return 'rgb(' + ((rgb[0] + 0.5) | 0) + ',' + ((rgb[1] + 0.5) | 0) + ',' + ((rgb[2] + 0.5) | 0) + ')';
  }

  const GRADE_WARM = [227, 106, 42];
  const GRADE_COOL = [46, 111, 190];
  const GRADE_CREAM = [247, 241, 228];
  const GRADE_AGE = [228, 196, 138];
  const GRADE_SEPIA = [166, 124, 82];

  // One composite for every uniform control. A second full-frame fill per control
  // costs more than the frame budget; the vignette is a separate cached blit.
  function uniformGrade(warmth, fade, paperAge, tints) {
    let wash = null;
    if (warmth > 0) wash = washOver(wash, GRADE_WARM, warmth * 0.72);
    else if (warmth < 0) wash = washOver(wash, GRADE_COOL, -warmth * 0.72);
    for (let i = 0; i < tints.length; i++) wash = washOver(wash, parseHex(palColor(tints[i].name)), tints[i].amount);
    if (!(fade > 0)) {
      if (paperAge > 0 && !wash) return { op: 'multiply', color: cssRgb(GRADE_SEPIA), alpha: paperAge * 0.85 };
      if (paperAge > 0) wash = washOver(wash, GRADE_SEPIA, paperAge * 0.75);
      if (!wash || !(wash.a > 0)) return null;
      return { op: 'overlay', color: cssRgb(wash.rgb), alpha: wash.a };
    }
    const cream = paperAge > 0 ? GRADE_AGE : GRADE_CREAM;
    const a = paperAge > 0 ? Math.min(1, fade * 0.7 + paperAge * 0.85) : fade * 0.75;
    if (!wash) return { op: 'screen', color: cssRgb(cream), alpha: a };
    wash = washOver(wash, cream, a);
    return { op: 'screen', color: cssRgb(wash.rgb), alpha: wash.a };
  }

  function gradeFill(ctx, w, h, op, color, alpha) {
    if (!(alpha > 0) || !color) return;
    ctx.globalCompositeOperation = op;
    ctx.globalAlpha = alpha > 1 ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, w, h);
  }

  // White through the subject is a multiply no-op; black at the corner is the falloff.
  // Cached by size: a radial gradient built every frame is several times over budget.
  const vignetteCache = {};
  function vignetteMask(w, h) {
    const key = w + 'x' + h;
    const hit = vignetteCache[key];
    if (hit) return hit;
    const c = makeCanvas(w, h);
    const g = c.getContext('2d');
    const cx = w * 0.5;
    const cy = h * 0.5;
    const r = Math.hypot(cx, cy);
    const grad = g.createRadialGradient(cx, cy, r * 0.28, cx, cy, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ffffff');
    grad.addColorStop(1, '#000000');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);
    vignetteCache[key] = c;
    return c;
  }

  function applyGrade(ctx, grade) {
    if (!gradeActive(grade)) return;
    const mixed = grade._mixed ? grade : null;
    const warmth = mixed ? grade.warmth : gradeNum(grade, 'warmth', -1, 1);
    const fade = mixed ? grade.fade : gradeNum(grade, 'fade', 0, 1);
    const vignette = mixed ? grade.vignette : gradeNum(grade, 'vignette', 0, 1);
    const paperAge = mixed ? grade.paperAge : gradeNum(grade, 'paperAge', 0, 1);
    const tints = tintEntries(grade);
    if (!warmth && !fade && !vignette && !paperAge && !tints.length) return;
    const c = ctx.canvas;
    const w = c.width;
    const h = c.height;
    const wash = uniformGrade(warmth, fade, paperAge, tints);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = 'none';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.shadowColor = 'rgba(0,0,0,0)';
    if (wash) gradeFill(ctx, w, h, wash.op, wash.color, wash.alpha);
    if (vignette > 0) {
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = vignette > 1 ? 1 : vignette;
      ctx.drawImage(vignetteMask(w, h), 0, 0);
    }
    ctx.restore();
  }
  FILM.applyGrade = applyGrade;

  // ---------------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------------

  function drawCard(ctx, title, lines, bg) {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, FILM.W, FILM.H);
    ctx.fillStyle = '#fff';
    ctx.font = '600 44px ui-monospace, Menlo, monospace';
    ctx.fillText(title, 60, 200);
    ctx.font = '28px ui-monospace, Menlo, monospace';
    let y = 270;
    for (const line of lines) {
      for (let k = 0; k < line.length; k += 56) {
        ctx.fillText(line.slice(k, k + 56), 60, y);
        y += 40;
      }
    }
  }

  function drawShot(ctx, shot, T, outgoing) {
    resetCtx(ctx, true);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const def = FILM.registry[shot.id];
    let t = Math.max(0, T - shot.start);
    if (outgoing) t = Math.min(t, shot.dur);
    const info = {
      dur: shot.dur,
      p: shot.dur > 0 ? clamp01(t / shot.dur) : 0,
      T,
      frame: Math.floor(T * FILM.FPS + EPS),
      W: FILM.W,
      H: FILM.H,
      S: FILM.S,
      lib: FILM.lib,
      shot,
      mode: modeOf(shot),
      outgoing: !!outgoing,
    };
    frameT = T;
    FILM.baseTransform(ctx);
    if (!def) {
      const msg = `no scene registered for shot '${shot.id}' (expected in ${shot.file || 'src/scenes/?'})`;
      FILM.errors.push({ T, shot: shot.id, message: msg, missing: true });
      drawCard(ctx, 'missing scene', [shot.id, String(shot.file || '')], '#2a2a2a');
    } else {
      try {
        ctx.save();
        def.draw(ctx, t, info);
      } catch (e) {
        FILM.errors.push({ T, shot: shot.id, message: String((e && e.message) || e), stack: e && e.stack });
        resetCtx(ctx, false);
        FILM.baseTransform(ctx);
        drawCard(ctx, 'scene error', [shot.id, String((e && e.message) || e)], '#5a1010');
        if (FILM.strict) throw e;
      }
      resetCtx(ctx, false);
    }
    applyGrade(ctx, gradeForShot(shot, T, outgoing));
    postShot(ctx, shot, def, T);
  }

  // How many frame starts fall strictly inside dur. Whip, inkwash and morph map the first of
  // those to the outgoing shot (p = 0) and stay short of 1, so the frame at `dur` is the incoming shot.
  function interiorFrames(dur) {
    const span = (dur - EPS) * FILM.FPS;
    if (!(span > 0)) return 0;
    const f = Math.floor(span);
    return span - f < 1e-9 ? f : f + 1;
  }

  const WHIP_DIR = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

  function transitionColor(c, fallback) {
    const pal = FILM.lib && FILM.lib.pal;
    if (typeof c === 'string' && pal && pal[c]) return pal[c];
    if (typeof c === 'string' && c.charAt(0) === '#') return c;
    return fallback;
  }

  function hexRGB(hex) {
    let h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    const n = parseInt(h.slice(0, 6), 16);
    if (!(n >= 0)) return [42, 28, 19];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Outgoing leaves along dir, incoming enters from the opposite side. Ease-in keeps the
  // crossing readable late in the window; ghosts (lib.smear) and speed lines sit on the seam.
  function whipComposite(ctx, A, B, tr, p, w, h) {
    const d = WHIP_DIR[tr.dir];
    if (!d) {
      FILM.errors.push({ T: frameT, message: `whip dir '${tr.dir}' is not one of left, right, up, down` });
      ctx.drawImage(B, 0, 0);
      return;
    }
    const dx = d[0];
    const dy = d[1];
    const e = p * p * p;
    let ox = 0, oy = 0, ix = 0, iy = 0;
    if (dx !== 0) {
      ox = Math.round(dx * w * e);
      ix = dx > 0 ? ox - w : ox + w;
    } else {
      oy = Math.round(dy * h * e);
      iy = dy > 0 ? oy - h : oy + h;
    }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(A, ox, oy);
    ctx.drawImage(B, ix, iy);
    const along = dx !== 0 ? w : h;
    const band = Math.max(12, Math.round(along * 0.16));
    const seam = dx !== 0 ? (dx > 0 ? ox : ix) : (dy > 0 ? oy : iy);
    const lib = FILM.lib;
    if (lib && typeof lib.smear === 'function') {
      ctx.save();
      ctx.beginPath();
      if (dx !== 0) ctx.rect(seam - band, 0, band * 2, h);
      else ctx.rect(0, seam - band, w, band * 2);
      ctx.clip();
      const smearAt = (img, x, y, sign) => {
        lib.smear(ctx, (g, u) => {
          const s = Math.round((u - 0.5) * band * 2.4);
          g.drawImage(img, x + dx * s * sign, y + dy * s * sign);
        }, { from: 0, to: 1, n: 4, mode: 'ghosts', alpha: 0.5, falloff: 1.4 });
      };
      smearAt(A, ox, oy, 1);
      smearAt(B, ix, iy, -1);
      ctx.restore();
    }
    const pal = lib && lib.pal;
    const light = pal && pal.white ? pal.white : '#FBF6EA';
    const dark = pal && pal.ink ? pal.ink : '#2A1C13';
    const gain = Math.pow(Math.max(0.001, Math.sin(Math.PI * p)), 0.4);
    const crossMax = dx !== 0 ? h : w;
    const px = -dy;
    const py = dx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 22; i++) {
      const cross = ihash(i, 3, 9) * crossMax;
      const len = along * (0.22 + 0.48 * ihash(i, 5, 9)) * (0.4 + 0.6 * gain);
      const half = len * 0.5;
      const slide = (ihash(i, 7, 9) - 0.5) * along * 0.06;
      const x1 = dx !== 0 ? seam - dx * half + slide : cross;
      const y1 = dy !== 0 ? seam - dy * half + slide : cross;
      const x2 = dx !== 0 ? seam + dx * half + slide : cross;
      const y2 = dy !== 0 ? seam + dy * half + slide : cross;
      const hw = (4 + ihash(i, 11, 9) * 9) * (0.55 + gain);
      ctx.globalAlpha = (i % 4 === 0 ? 0.72 : 0.4) * (0.5 + 0.5 * gain);
      ctx.fillStyle = i % 5 === 0 ? dark : light;
      ctx.beginPath();
      ctx.moveTo(x1 + px * hw, y1 + py * hw);
      ctx.lineTo(x1 - px * hw, y1 - py * hw);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Threshold field cached by size and seed, never by time. A pixel turns on once its
  // threshold is passed, so the mask only grows. Blots first, then distance outside them,
  // ranked so a cut of 233 — round((11/12) * 254), the last interior frame of a 0.5s seam —
  // covers at least 95%. Shorter seams never reach p = 11/12; inkwashComposite scales them.
  const inkFields = new Map();
  let inkStore = null;

  function inkClose(thr, w, h) {
    const nPix = w * h;
    const dist = new Uint16Array(nPix);
    const qx = new Int32Array(nPix);
    const qy = new Int32Array(nPix);
    let qe = 0;
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const i = row + x;
        if (thr[i] !== 255) continue;
        dist[i] = 65535;
      }
    }
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        if (thr[row + x] === 255) continue;
        qx[qe] = x;
        qy[qe] = y;
        qe++;
      }
    }
    let qs = 0;
    while (qs < qe) {
      const x = qx[qs];
      const y = qy[qs];
      const base = dist[y * w + x] + 1;
      qs++;
      if (x > 0) {
        const j = y * w + (x - 1);
        if (dist[j] > base) { dist[j] = base; qx[qe] = x - 1; qy[qe] = y; qe++; }
      }
      if (x + 1 < w) {
        const j = y * w + (x + 1);
        if (dist[j] > base) { dist[j] = base; qx[qe] = x + 1; qy[qe] = y; qe++; }
      }
      if (y > 0) {
        const j = (y - 1) * w + x;
        if (dist[j] > base) { dist[j] = base; qx[qe] = x; qy[qe] = y - 1; qe++; }
      }
      if (y + 1 < h) {
        const j = (y + 1) * w + x;
        if (dist[j] > base) { dist[j] = base; qx[qe] = x; qy[qe] = y + 1; qe++; }
      }
    }
    const HIST = 4096;
    const hist = new Uint32Array(HIST);
    const keyOf = (i) => {
      if (thr[i] !== 255) return thr[i];
      const d = dist[i] > 3000 ? 3000 : dist[i];
      return 1000 + d;
    };
    for (let i = 0; i < nPix; i++) hist[keyOf(i)]++;
    const cursor = new Uint32Array(HIST);
    let acc = 0;
    for (let k = 0; k < HIST; k++) {
      cursor[k] = acc;
      acc += hist[k];
    }
    const last = nPix > 1 ? nPix - 1 : 1;
    for (let i = 0; i < nPix; i++) {
      const rank = cursor[keyOf(i)]++;
      const f = rank / last;
      let t;
      if (f <= 0.95) {
        t = Math.round((f / 0.95) * 233);
        if (t < 1) t = 1;
      } else {
        t = 234 + Math.round(((f - 0.95) / 0.05) * 20);
        if (t > 254) t = 254;
      }
      thr[i] = t;
    }
  }

  function inkField(w, h, seed) {
    const key = w + 'x' + h + ':' + seed;
    const hit = inkFields.get(key);
    if (hit) return hit;
    const thr = new Uint8Array(w * h);
    thr.fill(255);
    const blobs = 8;
    const diag = Math.hypot(w, h);
    const base = Math.min(w, h);
    for (let b = 0; b < blobs; b++) {
      const cx = (b === 0 ? 0.5 : 0.08 + 0.84 * ihash(b, seed, 1)) * w;
      const cy = (b === 0 ? 0.48 : 0.07 + 0.86 * ihash(b, seed, 2)) * h;
      const rad = (b === 0 ? 0.5 * diag : (0.13 + 0.12 * ihash(b, seed, 3)) * base);
      const ph = ihash(b, seed, 4) * Math.PI * 2;
      const aspect = b === 0 ? 0.86 : 0.7 + 0.55 * ihash(b, seed, 5);
      const cph = Math.cos(ph);
      const sph = Math.sin(ph);
      const R = rad * 1.34;
      const x0 = Math.max(0, cx - R) | 0;
      const y0 = Math.max(0, cy - R) | 0;
      const x1 = Math.min(w - 1, Math.ceil(cx + R));
      const y1 = Math.min(h - 1, Math.ceil(cy + R));
      const step = 2;
      for (let y = y0; y <= y1; y += step) {
        const dy = y - cy;
        for (let x = x0; x <= x1; x += step) {
          const dx = x - cx;
          if (dx * dx + dy * dy > R * R) continue;
          const d = Math.hypot(dx, dy) || 1;
          const c = dx / d;
          const s = dy / d;
          const harm = (c * c - s * s) * cph + 2 * c * s * sph;
          const ry = rad * (1 + 0.3 * harm);
          const rx = ry * aspect;
          const e = Math.hypot(dx / rx, dy / (ry * 0.9));
          const t = e >= 1 ? 255 : Math.max(1, Math.min(254, Math.ceil(e * 254)));
          for (let oy = 0; oy < step && y + oy < h; oy++) {
            for (let ox = 0; ox < step && x + ox < w; ox++) {
              const i = (y + oy) * w + (x + ox);
              if (t < thr[i]) thr[i] = t;
            }
          }
        }
      }
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const c0 = thr[i];
        if (c0 === 255) continue;
        let t = c0 + ((ihash(x, y, seed + 17) - 0.5) * 28) | 0;
        if (t < 1) t = 1;
        else if (t > 254) t = 254;
        thr[i] = t;
      }
    }
    inkClose(thr, w, h);
    inkFields.set(key, thr);
    return thr;
  }

  function inkPack(w, h) {
    const cw = Math.max(1, w >> 1);
    const ch = Math.max(1, h >> 1);
    if (inkStore && inkStore.w === w && inkStore.h === h) return inkStore;
    const mk = () => {
      const c = makeCanvas(cw, ch);
      const g = c.getContext('2d', { alpha: true, willReadFrequently: true });
      return { c, g, img: g.createImageData(cw, ch) };
    };
    const mask = mk();
    const rim = mk();
    const hold = makeCanvas(w, h);
    const bytes = new Uint8Array(4);
    const word = (r, g, b, a) => {
      bytes[0] = r;
      bytes[1] = g;
      bytes[2] = b;
      bytes[3] = a;
      return new Uint32Array(bytes.buffer)[0];
    };
    inkStore = {
      w: w,
      h: h,
      cw: cw,
      ch: ch,
      mc: mask.c,
      mg: mask.g,
      mask: mask.img,
      rc: rim.c,
      rg: rim.g,
      rim: rim.img,
      hold: hold,
      hg: hold.getContext('2d', { alpha: true, willReadFrequently: true }),
      word: word,
    };
    return inkStore;
  }

  function inkwashComposite(ctx, A, B, tr, p, w, h) {
    const seed = Number.isFinite(+tr.seed) ? (+tr.seed) | 0 : 1;
    // Half the device grid: the stipple is already noisy, and a nearest upscale stays binary.
    const cw = Math.max(1, w >> 1);
    const ch = Math.max(1, h >> 1);
    const thr = inkField(cw, ch, seed);
    // p = k/n on interior frames and stays below 1, so round(p * 254) only hits the
    // rank field's closing cut on a 0.5s seam (last p = 11/12). A pure quantile of p
    // stops at (n-1)/n — about 83% at dur 0.25, not closed. Scale a shorter seam's p
    // up to that same cut; a longer one already passes it. p = 0 stays cut 0, and the
    // cut only rises, so the mask only grows.
    const tuned = interiorFrames(0.5);
    const refP = tuned > 1 ? (tuned - 1) / tuned : 1;
    const n = interiorFrames(tr.dur);
    const pLast = n > 1 ? (n - 1) / n : 1;
    const gain = pLast < refP ? refP / pLast : 1;
    const cut = Math.max(0, Math.min(254, Math.round(Math.min(1, p * gain) * 254)));
    const pack = inkPack(w, h);
    const md = pack.mask.data;
    const rd = pack.rim.data;
    const m32 = new Uint32Array(md.buffer, md.byteOffset, md.length >> 2);
    const r32 = new Uint32Array(rd.buffer, rd.byteOffset, rd.length >> 2);
    const rgb = hexRGB(transitionColor(tr.color, '#2A1C13'));
    const onWord = pack.word(0, 0, 0, 255);
    const rimWord = pack.word(rgb[0], rgb[1], rgb[2], 255);
    const band = 18;
    for (let i = 0; i < thr.length; i++) {
      const t = thr[i];
      if (t <= cut) {
        m32[i] = onWord;
        r32[i] = 0;
      } else if (t !== 255 && t <= cut + band) {
        m32[i] = 0;
        r32[i] = rimWord;
      } else {
        m32[i] = 0;
        r32[i] = 0;
      }
    }
    pack.mg.putImageData(pack.mask, 0, 0);
    pack.rg.putImageData(pack.rim, 0, 0);
    const hg = pack.hg;
    hg.setTransform(1, 0, 0, 1, 0, 0);
    hg.globalAlpha = 1;
    hg.globalCompositeOperation = 'source-over';
    hg.clearRect(0, 0, w, h);
    hg.imageSmoothingEnabled = false;
    hg.drawImage(B, 0, 0);
    hg.globalCompositeOperation = 'destination-in';
    hg.drawImage(pack.mc, 0, 0, w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(A, 0, 0);
    ctx.drawImage(pack.hold, 0, 0);
    ctx.drawImage(pack.rc, 0, 0, w, h);
  }

  function morphComposite(ctx, A, B, tr, p, w, h) {
    const lib = FILM.lib;
    let pts;
    try {
      if (!lib || typeof lib.morph !== 'function' || typeof lib.geo !== 'function') throw new Error('lib.morph is not available');
      pts = lib.morph(lib.geo(tr.from).outline(), lib.geo(tr.to).outline(), p, { n: 160 });
    } catch (err) {
      FILM.errors.push({ T: frameT, message: `morph transition: ${err && err.message ? err.message : err}` });
      ctx.drawImage(B, 0, 0);
      return;
    }
    const open = 1 - Math.pow(1 - p, 1.6);
    const s = 0.12 + 0.88 * open;
    let cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      cx += pts[i][0];
      cy += pts[i][1];
    }
    cx /= pts.length;
    cy /= pts.length;
    const Sx = w / FILM.W;
    const Sy = h / FILM.H;
    const path = new Path2D();
    for (let i = 0; i < pts.length; i++) {
      const x = (cx + (pts[i][0] - cx) * s) * Sx;
      const y = (cy + (pts[i][1] - cy) * s) * Sy;
      if (i === 0) path.moveTo(x, y);
      else path.lineTo(x, y);
    }
    path.closePath();
    ctx.drawImage(A, 0, 0);
    ctx.save();
    ctx.clip(path);
    ctx.drawImage(B, 0, 0);
    ctx.restore();
    ctx.lineWidth = Math.max(2, 6 * Sx);
    ctx.strokeStyle = (lib.pal && lib.pal.ink) || '#2A1C13';
    ctx.lineJoin = 'round';
    ctx.stroke(path);
  }

  // fade, iris and wipe: A is the outgoing shot, B the incoming one, p in (0, 1) exclusive.
  // whip, inkwash and morph include p = 0 (outgoing alone). Their p stays below 1 inside the window.
  function composite(ctx, A, B, tr, p) {
    resetCtx(ctx, true);
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    if (tr.kind === 'whip') whipComposite(ctx, A, B, tr, p, w, h);
    else if (tr.kind === 'inkwash') inkwashComposite(ctx, A, B, tr, p, w, h);
    else if (tr.kind === 'morph') morphComposite(ctx, A, B, tr, p, w, h);
    else {
      const e = easeInOutCubic(p);
      ctx.drawImage(A, 0, 0);
      switch (tr.kind) {
        case 'fade':
          ctx.globalAlpha = e;
          ctx.drawImage(B, 0, 0);
          break;
        case 'iris': {
          const S = w / FILM.W;
          const cx = (tr.x != null ? tr.x : FILM.W / 2) * S;
          const cy = (tr.y != null ? tr.y : FILM.H / 2) * S;
          const R = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy));
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(0.001, e * R), 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(B, 0, 0);
          break;
        }
        case 'wipe': {
          const dir = tr.dir || 'down';
          ctx.beginPath();
          if (dir === 'up') ctx.rect(0, h * (1 - e), w, h * e);
          else if (dir === 'left') ctx.rect(w * (1 - e), 0, w * e, h);
          else if (dir === 'right') ctx.rect(0, 0, w * e, h);
          else ctx.rect(0, 0, w, h * e);
          ctx.clip();
          ctx.drawImage(B, 0, 0);
          break;
        }
        default:
          ctx.drawImage(B, 0, 0);
      }
    }
    resetCtx(ctx, false);
  }

  const KINDS = { cut: 1, fade: 1, flash: 1, iris: 1, wipe: 1, whip: 1, inkwash: 1, morph: 1 };
  FILM.TRANSITION_KINDS = Object.keys(KINDS);

  /** Draws global time T (seconds) to FILM.canvas. Returns the active shot entry. */
  FILM.renderFrame = function renderFrame(T) {
    const P = prepare();
    if (!FILM.ctx) throw new Error('FILM.renderFrame: call FILM.mount(canvas) first');
    T = Number(T) || 0;
    if (T < 0) T = 0;
    if (P.duration > 0 && T > P.duration) T = P.duration;
    const idx = shotIndexAt(T);
    const ctx = FILM.ctx;
    if (idx < 0) {
      resetCtx(ctx, true);
      FILM.baseTransform(ctx);
      drawCard(ctx, 'empty timeline', ['FILM.TIMELINE.shots is empty'], '#222');
      return null;
    }
    const shot = P.shots[idx];
    const tr = shot.transitionIn;
    const inT = T - shot.start;
    if (!(idx > 0 && tr && tr.kind !== 'cut' && tr.dur > 0 && inT < tr.dur - EPS)) {
      drawShot(ctx, shot, T, false);
      return shot;
    }
    if (!KINDS[tr.kind]) {
      FILM.errors.push({ T, shot: shot.id, message: `unknown transition kind '${tr.kind}'` });
      drawShot(ctx, shot, T, false);
      return shot;
    }
    // Frames are sampled at their start, so frame k of an n-frame transition sits at inT = k / FPS.
    const k = Math.max(0, inT * FILM.FPS);
    const n = tr.dur * FILM.FPS;
    if (tr.kind === 'flash') {

   *                     Draw a single loop as it stands (inkPath(ctx, g.outline(), { closed: true, smooth: false })),

   *                     and side use the same map, and the station argument stays in table space.
   *                     Check 7 uses it for a match cut that lands in the middle of a camera move.

  const geoCache = new Map();

  function scanFill(mask, w, h, ox, oy, poly) {
    const n = poly.length;

        buckets[y].push(x0 + (x1 - x0) * t);

    for (let y = 0; y < h; y++) {
      const xs = buckets[y];
      if (xs.length < 2) continue;
      xs.sort((a, b) => a - b);

      for (let i = 0; i + 1 < xs.length; i += 2) {

  // One circuit of the outer rim. 0 east, 1 south, 2 west, 3 north, fill kept on the right.
  // A one-pixel neck used to close the walk on a wing tip and leave the body behind.
  // Opens heading east on the top-most rim pixel. The circuit is closed when the walk is back
  // on that pixel; a cap that expires first throws instead of returning a short loop.
  function traceOuter(mask, w, h) {
    const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && mask[y * w + x] === 1;
    let sx = -1, sy = -1;
    for (let y = 0; y < h && sx < 0; y++) {

    // (w + h) * 8 died mid-comb, short of the far tooth. One circuit is well under 4 visits per pixel.
    const limit = w * h * 4;
    let closed = false;
    for (let n = 0; n < limit; n++) {
      let moved = false;
      for (const turn of [1, 0, 3, 2]) {
        const nd = (dir + turn) % 4;
        const nx = x + step[nd][0], ny = y + step[nd][1];
        if (!on(nx, ny)) continue;
        x = nx;
        y = ny;
        dir = nd;
        loop.push([x, y]);

  // 4-connected islands. The rim walk steps the same way, so a diagonal crack is still two components

  function countComponents(mask, w, h) {
    const seen = new Uint8Array(w * h);
    let count = 0;
    const stack = [];
    for (let i = 0; i < mask.length; i++) {
      if (!mask[i] || seen[i]) continue;
      count++;
      stack.push(i);
      seen[i] = 1;
      while (stack.length) {
        const p = stack.pop();
        const x = p % w;
        const y = (p / w) | 0;
        if (x > 0 && mask[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; stack.push(p - 1); }
        if (x + 1 < w && mask[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; stack.push(p + 1); }
        if (y > 0 && mask[p - w] && !seen[p - w]) { seen[p - w] = 1; stack.push(p - w); }

    const mask = new Uint8Array(w * h);

          const d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = [nx, ny]; }
        }
      }
      return best || [x, y];

  }

  function shapedAt(table, zoom, about) {

    let v = geoCache.get(id);

  /** tracePath(ctx, pts, closed=true) : adds the polyline to the current path (no beginPath). */

    for (let i = 0; i < pts.length; i++) {

      if (i === 0) ctx.moveTo(p[0], p[1]);
      else ctx.lineTo(p[0], p[1]);

  };

  /**

   * Returns a flat [x0,y0,x1,y1,...] array (closed: no duplicate end).

  function sampleFlat(P, closed, step, smooth) {

    for (let i = 0; i < segs; i++) {
      const p1 = P[i];
      const p2 = P[(i + 1) % n];
      const d = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const k = Math.max(1, Math.ceil(d / step));
      if (!smooth || n < 3) {
        for (let j = 0; j < k; j++) out.push(lerp(p1[0], p2[0], j / k), lerp(p1[1], p2[1], j / k));
        continue;

        const a3x = ((t3 - t) / (t3 - t2)) * p2[0] + ((t - t2) / (t3 - t2)) * p3[0];
        const a3y = ((t3 - t) / (t3 - t2)) * p2[1] + ((t - t2) / (t3 - t2)) * p3[1];
        const b1x = ((t2 - t) / t2) * a1x + (t / t2) * a2x;
        const b1y = ((t2 - t) / t2) * a1y + (t / t2) * a2y;
        const b2x = ((t3 - t) / (t3 - t1)) * a2x + ((t - t1) / (t3 - t1)) * a3x;

  lib.smoothPts = (pts, closed = true, step = 6) => {

    for (let i = 0; i < f.length; i += 2) out.push([f[i], f[i + 1]]);

  function toPolys(clip) {

   * and fills it in one call.
   */
  function ribbon(ctx, X, Y, NX, NY, S, i0, i1, q) {
    const n = i1 - i0 + 1;
    if (n < 2) return null;
    const s0 = S[i0];
    const L = Math.max(1e-6, S[i1] - s0);
    const DX = new Float64Array(n);
    const DY = new Float64Array(n);
    const bs = q.boilSeed;
    const wf = q.wobbleFreq;
    for (let k = 0; k < n; k++) {
      const i = i0 + k;
      const s = S[i] - s0 + q.phase;
      let d =
        q.wobble * (0.72 * noise1(s * wf, q.seed) + 0.28 * noise1(s * wf * 3.3, q.seed + 1)) +
        q.tremble * noise1(s / 7.5, q.seed + 2) +
        q.boilAmp * noise1(s * wf * 2.2 + 0.37, bs) +
        q.tremble * 0.7 * noise1(s / 6.3, bs + 5) +
        q.offset;
      if (q.closeBlend > 0 && S[i1] - S[i] < q.closeBlend) {
        // pen returning to the start: pull toward the start's displacement, not all the way
        const u = 1 - (S[i1] - S[i]) / q.closeBlend;
        const s2 = s - q.loopLen;
        const d0 =
          q.wobble * (0.72 * noise1(s2 * wf, q.seed) + 0.28 * noise1(s2 * wf * 3.3, q.seed + 1)) +
          q.boilAmp * noise1(s2 * wf * 2.2 + 0.37, bs) +
          q.offset;
        d = lerp(d, d0, u * u * (3 - 2 * u) * 0.8);
      }
      DX[k] = X[i] + NX[i] * d;
      DY[k] = Y[i] + NY[i] * d;
    }
    // width profile
    const Wd = new Float64Array(n);
    const tIn = Math.min(q.taperIn, L * 0.45);
    const tOut = Math.min(q.taperOut, L * 0.45);
    for (let k = 0; k < n; k++) {
      const s = S[i0 + k] - s0;
      let w = q.width;
      if (tIn > 0 && s < tIn) w *= q.minW + (1 - q.minW) * Math.pow(s / tIn, 0.55);
      if (tOut > 0 && L - s < tOut) w *= q.minW + (1 - q.minW) * Math.pow((L - s) / tOut, 0.7);
      w *= 1 + q.widthJitter * (0.6 * noise1(s * 0.012 + 3.1, q.seed + 3) + 0.4 * noise1(s * 0.045, q.seed + 4));
      if (q.swell) w *= 1 + q.swell * Math.sin(Math.PI * clamp(s / L));
      if (q.pressure) w *= q.pressure(s / L);
      Wd[k] = Math.max(0.05, w) * 0.5;
    }
    // offset normals from the displaced line
    const LX = new Float64Array(n), LY = new Float64Array(n), RX = new Float64Array(n), RY = new Float64Array(n);
    for (let k = 0; k < n; k++) {
      const a = k > 0 ? k - 1 : k;
      const b = k < n - 1 ? k + 1 : k;
      let tx = DX[b] - DX[a], ty = DY[b] - DY[a];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const s = S[i0 + k];
      const wl = Math.max(0.03, Wd[k] + q.rough * noise1(s / 3.1, q.seed + 20));
      const wr = Math.max(0.03, Wd[k] + q.rough * noise1(s / 3.1, q.seed + 21));
      LX[k] = DX[k] - ty * wl;
      LY[k] = DY[k] + tx * wl;
      RX[k] = DX[k] + ty * wr;
      RY[k] = DY[k] - tx * wr;
    }
    // reveal window: same ribbon, only the quads inside the arc-length span. Absent => today's fill.
    if (q.part) return paintSpan(ctx, DX, DY, LX, LY, RX, RY, Wd, S, i0, n, q.part);
    ctx.beginPath();
    for (let k = 0; k < n - 1; k++) {
      ctx.moveTo(LX[k], LY[k]);
      ctx.lineTo(LX[k + 1], LY[k + 1]);
      ctx.lineTo(RX[k + 1], RY[k + 1]);
      ctx.lineTo(RX[k], RY[k]);
      ctx.closePath();
    }
    // soft round ends
    ctx.moveTo(DX[0] + Wd[0], DY[0]);
    ctx.arc(DX[0], DY[0], Wd[0], 0, TAU);
    ctx.moveTo(DX[n - 1] + Wd[n - 1], DY[n - 1]);
    ctx.arc(DX[n - 1], DY[n - 1], Wd[n - 1], 0, TAU);
    ctx.fill('nonzero');
    return { DX, DY };
  }

  function centreline(pts, closed, step, smooth, startFrac, overlapPx) {
    const P = pts.map(XY);
    let F = sampleFlat(P, closed, step, smooth);
    let m = F.length / 2;
    let loopLen = 0;
    if (closed && m > 2) {
      // rotate so the pen starts at a seeded place, then run past the start
      const st = Math.floor(startFrac * m) % m;
      const R = new Array(F.length);
      for (let k = 0; k < m; k++) {
        R[2 * k] = F[2 * ((k + st) % m)];
        R[2 * k + 1] = F[2 * ((k + st) % m) + 1];
      }
      for (let k = 0; k < m; k++) loopLen += Math.hypot(R[(2 * (k + 1)) % R.length] - R[2 * k], R[((2 * (k + 1)) % R.length) + 1] - R[2 * k + 1]);
      R.push(R[0], R[1]);
      let acc = 0;
      for (let k = 1; k <= m && acc < overlapPx; k++) {
        const x = R[2 * (k % m)], y = R[2 * (k % m) + 1];
        acc += Math.hypot(x - R[R.length - 2], y - R[R.length - 1]);
        R.push(x, y);
      }
      F = R;
      m = F.length / 2;
    }
    const X = new Float64Array(m), Y = new Float64Array(m), S = new Float64Array(m);
    for (let k = 0; k < m; k++) {
      X[k] = F[2 * k];
      Y[k] = F[2 * k + 1];
      if (k > 0) S[k] = S[k - 1] + Math.hypot(X[k] - X[k - 1], Y[k] - Y[k - 1]);
    }
    const NX = new Float64Array(m), NY = new Float64Array(m);
    for (let k = 0; k < m; k++) {
      const a = Math.max(0, k - 2), b = Math.min(m - 1, k + 2);
      let tx = X[b] - X[a], ty = Y[b] - Y[a];
      const tl = Math.hypot(tx, ty) || 1;
      NX[k] = -ty / tl;
      NY[k] = tx / tl;
    }
    return { X, Y, S, NX, NY, m, loopLen };
  }

  /**
   * inkPath(ctx, points, opts) : a hand-inked line or closed shape.
   *   closed      false
   *   width       3        nominal pen width (art bible: hero 5, secondary 3, detail 1.8)
   *   color       pal.ink
   *   alpha       1
   *   seed        1        give each drawn object its own seed so their wobbles differ
   *   smooth      true     Catmull-Rom through the points (false = straight segments)
   *   step        2.5      resample spacing in px
   *   wobble      2        low-frequency drift amplitude (px)
   *   wobbleFreq  1/150    drift frequency (cycles per px)
   *   tremble     0.4      high-frequency hand tremble (px)
   *   rough       0.22+0.07*width  ragged ink edge (px), each side independent
   *   boil        auto     drawing index (default lib.boil(lib.T)); false freezes the line
   *   boilAmp     0.7      how far the line moves between boil drawings (px)
   *   taper       [18,34]  px of taper at start and end (number = both)
   *   minWidth    0.14     width fraction at the very tips
   *   swell       0.2      extra width through the middle of an open stroke
   *   widthJitter 0.34     pressure variation (slow plus a faster drag)
   *   pressure    null     fn(u 0..1) => width multiplier
   *   overlap     14       closed shapes: how far the pen runs past its start (px)
   *   fill        null     closed shapes: fill colour under the line (uses the wobbled outline)
   *   fillAlpha   1
   *   double      false    true or { offset, width, alpha, from, to, seed }: a second quick retrace
   *                        (defaults: 30 percent of the width, min 1.5 px at 5 px, 3 px clear of the line, alpha 0.4)
   *   reveal      null     0..1 draws that fraction of the arc length from the start, double included.
   *                        [from, to] draws the segment (a running dash). Omit, or pass 1 / [0, 1], for the whole line.
   *   nib         null     { r, color, blot } ink drop and highlight on the moving tip while the span is unfinished
   */
  // null => draw the whole line (today's pixels). Otherwise absolute arc-length window on S, nib on the open tip.
  function revealOf(reveal, L) {
    if (reveal == null) return null;
    let a, b;
    if (Array.isArray(reveal)) {
      a = +reveal[0];
      b = +reveal[1];
      if (!isFinite(a) || !isFinite(b)) return null;
      if (b < a) {
        const s = a;
        a = b;
        b = s;
      }
    } else {
      a = 0;
      b = +reveal;
      if (!isFinite(b)) return null;
    }
    a = clamp(a, 0, 1);
    b = clamp(b, 0, 1);
    if (a <= 0 && b >= 1) return null;
    return { sFrom: a * L, sTo: b * L, nib: b > a && b < 1 };
  }

  function spanPoint(DX, DY, Wd, S, i0, n, s) {
    const last = n - 1;
    let k = 0;
    if (s >= S[i0 + last]) k = Math.max(0, last - 1);
    else if (s > S[i0]) while (k < last - 1 && S[i0 + k + 1] < s) k++;
    const a = S[i0 + k], b = S[i0 + k + 1];
    let u = b > a ? (s - a) / (b - a) : 0;
    if (u < 0) u = 0;
    else if (u > 1) u = 1;
    const hw = Wd[k] + (Wd[k + 1] - Wd[k]) * u;
    return {
      x: DX[k] + (DX[k + 1] - DX[k]) * u,
      y: DY[k] + (DY[k + 1] - DY[k]) * u,
      hw: hw > 0.05 ? hw : 0.05,
      w: hw * 2,
    };
  }

  // Quads whose both ends sit inside the window use the same vertices as the full ribbon.
  function paintSpan(ctx, DX, DY, LX, LY, RX, RY, Wd, S, i0, n, part) {
    const sFrom = part.sFrom, sTo = part.sTo;
    if (!(n >= 2) || !(sTo > sFrom)) return null;
    const sLo = S[i0], sHi = S[i0 + n - 1];
    if (!(sTo > sLo) || !(sFrom < sHi)) return null;
    ctx.beginPath();
    let drew = false;
    for (let k = 0; k < n - 1; k++) {
      const a = S[i0 + k], b = S[i0 + k + 1];
      if (!(b > a)) {
        if (a >= sFrom && a <= sTo) {
          ctx.moveTo(LX[k], LY[k]);
          ctx.lineTo(LX[k + 1], LY[k + 1]);
          ctx.lineTo(RX[k + 1], RY[k + 1]);
          ctx.lineTo(RX[k], RY[k]);
          ctx.closePath();
          drew = true;
        }
        continue;
      }
      if (b <= sFrom || a >= sTo) continue;
      let t0 = 0, t1 = 1;
      if (a < sFrom) t0 = (sFrom - a) / (b - a);
      if (b > sTo) t1 = (sTo - a) / (b - a);
      if (!(t1 > t0)) continue;
      const at = (A, B, t) => (t <= 0 ? A : t >= 1 ? B : A + (B - A) * t);
      ctx.moveTo(at(LX[k], LX[k + 1], t0), at(LY[k], LY[k + 1], t0));
      ctx.lineTo(at(LX[k], LX[k + 1], t1), at(LY[k], LY[k + 1], t1));
      ctx.lineTo(at(RX[k], RX[k + 1], t1), at(RY[k], RY[k + 1], t1));
      ctx.lineTo(at(RX[k], RX[k + 1], t0), at(RY[k], RY[k + 1], t0));
      ctx.closePath();
      drew = true;
    }
    if (sFrom <= sLo && sTo > sLo) {
      ctx.moveTo(DX[0] + Wd[0], DY[0]);
      ctx.arc(DX[0], DY[0], Wd[0], 0, TAU);
      drew = true;
    }
    if (sTo >= sHi && sFrom < sHi) {
      ctx.moveTo(DX[n - 1] + Wd[n - 1], DY[n - 1]);
      ctx.arc(DX[n - 1], DY[n - 1], Wd[n - 1], 0, TAU);
      drew = true;
    }
    // Running dash: round the trailing cut. The leading tip is the nib, not a second cap.
    if (sFrom > sLo && sFrom < sHi) {
      const tail = spanPoint(DX, DY, Wd, S, i0, n, sFrom);
      ctx.moveTo(tail.x + tail.hw, tail.y);
      ctx.arc(tail.x, tail.y, tail.hw, 0, TAU);
      drew = true;
    }
    if (drew) ctx.fill('nonzero');
    if (sTo > sLo && sTo < sHi) return spanPoint(DX, DY, Wd, S, i0, n, sTo);
    return null;
  }

  function paintDouble(ctx, C, q, o, b, width, tIn, tOut, seed, closed, span) {
    if (!o.double) return;
    const d = o.double === true ? {} : o.double;
    const ds = seedInt(d.seed != null ? d.seed : seed + 977);
    const r = rng(ds);
    const L = C.S[C.m - 1];
    let f0 = d.from != null ? d.from : closed ? r.range(0, 0.35) : r.range(0.03, 0.18);
    let f1 = d.to != null ? d.to : closed ? f0 + r.range(0.45, 0.75) : r.range(0.72, 0.95);
    f1 = Math.min(1, f1);
    let i0 = 0, i1 = C.m - 1;
    while (i0 < C.m - 1 && C.S[i0] < f0 * L) i0++;
    while (i1 > i0 && C.S[i1] > f1 * L) i1--;
    const dw = d.width != null ? width * d.width : Math.max(1.2, width * 0.3);
    const q2 = Object.assign({}, q, {
      seed: ds,
      width: dw,
      rough: 0.15 + dw * 0.07,
      offset: d.offset != null ? d.offset : (width / 2 + 3) * (r() < 0.5 ? -1 : 1),
      wobble: q.wobble * 1.3,
      boilSeed: (hash(ds, b) | 0) & 0x7fffffff,
      taperIn: Math.max(tIn, 26),
      taperOut: Math.max(tOut, 40),
      closeBlend: 0,
      swell: 0.35,
    });
    if (span) q2.part = span;
    ctx.globalAlpha *= d.alpha != null ? d.alpha : 0.4;
    ribbon(ctx, C.X, C.Y, C.NX, C.NY, C.S, i0, i1, q2);
  }

  function inkNib(ctx, tip, nib, color, seed) {
    const r = nib.r != null ? nib.r : Math.max(1.8, tip.w * 0.62);
    const blot = nib.blot;
    const br = blot === true ? r * 1.7 : blot ? Math.abs(+blot) || 0 : 0;
    if (!(r > 0) && !(br > 0)) return;
    ctx.save();
    ctx.fillStyle = nib.color || color;
    if (br > 0) {
      const ang = h3(seed, 23, 9) * TAU;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, br, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tip.x + Math.cos(ang) * br * 0.34, tip.y + Math.sin(ang) * br * 0.34, br * 0.55, 0, TAU);
      ctx.fill();
    }
    if (r > 0) {
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha *= 0.85;
      ctx.fillStyle = pal.white;
      ctx.beginPath();
      ctx.arc(tip.x - r * 0.28, tip.y - r * 0.32, Math.max(1.2, r * 0.4), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function inkPath(ctx, pts, o = {}) {
    if (!pts || pts.length < 2) return;
    const closed = !!o.closed;
    const seed = seedInt(o.seed === undefined ? 1 : o.seed);
    const width = o.width != null ? o.width : 3;
    const step = o.step || 2.5;
    const smooth = o.smooth !== false;
    const taper = o.taper != null ? o.taper : closed ? [10, 22] : [18, 34];
    const tIn = Array.isArray(taper) ? taper[0] : taper;
    const tOut = Array.isArray(taper) ? taper[1] : taper;
    const overlap = closed ? (o.overlap != null ? o.overlap : 14) : 0;
    const C = centreline(pts, closed, step, smooth, closed ? h3(seed, 11, 3) : 0, overlap);
    if (C.m < 2) return;
    const b = boilIndex(o);
    const q = {
      seed,
      width,
      wobble: o.wobble != null ? o.wobble : 2,
      wobbleFreq: o.wobbleFreq || 1 / 150,
      tremble: o.tremble != null ? o.tremble : 0.4,
      rough: o.rough != null ? o.rough : 0.22 + width * 0.07,
      boilAmp: o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.7,
      boilSeed: (hash(seed, b) | 0) & 0x7fffffff,
      taperIn: tIn,
      taperOut: tOut,
      minW: o.minWidth != null ? o.minWidth : 0.14,
      swell: closed ? 0 : o.swell != null ? o.swell : 0.2,
      widthJitter: o.widthJitter != null ? o.widthJitter : 0.34,
      pressure: o.pressure || null,
      offset: 0,
      phase: 0,
      closeBlend: closed ? Math.min(60, C.loopLen * 0.25) + overlap : 0,
      loopLen: C.loopLen,
    };
    const span = revealOf(o.reveal, C.S[C.m - 1]);
    ctx.save();
    const color = o.color || pal.ink;
    const alpha = o.alpha != null ? o.alpha : 1;
    if (closed && o.fill && !span) {
      // fill follows the wobbled outline (without the overlap run)
      const F = ribbonLine(C, q, 0, Math.max(1, C.m - 1));
      ctx.beginPath();
      for (let k = 0; k < F.n; k++) {
        if (C.S[k] > C.loopLen) break;
        if (k === 0) ctx.moveTo(F.DX[k], F.DY[k]);
        else ctx.lineTo(F.DX[k], F.DY[k]);
      }
      ctx.closePath();
      ctx.globalAlpha *= o.fillAlpha != null ? o.fillAlpha : 1;
      ctx.fillStyle = o.fill;
      ctx.fill();
      ctx.restore();
      ctx.save();
    }
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    if (!span) {
      ribbon(ctx, C.X, C.Y, C.NX, C.NY, C.S, 0, C.m - 1, q);
      paintDouble(ctx, C, q, o, b, width, tIn, tOut, seed, closed, null);
    } else {
      const tip = ribbon(ctx, C.X, C.Y, C.NX, C.NY, C.S, 0, C.m - 1, Object.assign({}, q, { part: span }));
      const inkA = ctx.globalAlpha;
      paintDouble(ctx, C, q, o, b, width, tIn, tOut, seed, closed, span);
      ctx.globalAlpha = inkA;
      if (span.nib && o.nib && tip) inkNib(ctx, tip, o.nib, color, seed);
    }
    ctx.restore();
  }

  // displaced centreline only (for fills)
  function ribbonLine(C, q, i0, i1) {
    const n = i1 - i0 + 1;
    const DX = new Float64Array(n), DY = new Float64Array(n);
    const wf = q.wobbleFreq;
    for (let k = 0; k < n; k++) {
      const i = i0 + k;
      const s = C.S[i];
      const d =
        q.wobble * (0.72 * noise1(s * wf, q.seed) + 0.28 * noise1(s * wf * 3.3, q.seed + 1)) +
        q.boilAmp * noise1(s * wf * 2.2 + 0.37, q.boilSeed);
      DX[k] = C.X[i] + C.NX[i] * d;
      DY[k] = C.Y[i] + C.NY[i] * d;
    }
    return { DX, DY, n };
  }

  lib.inkPath = inkPath;
  lib.inkLine = (ctx, x1, y1, x2, y2, o = {}) => inkPath(ctx, [[x1, y1], [x2, y2]], Object.assign({ smooth: false }, o));
  lib.inkCircle = (ctx, cx, cy, r, o = {}) =>
    inkPath(ctx, lib.ellipsePts(cx, cy, r, o.ry != null ? o.ry : r, Math.max(24, Math.ceil(r * 0.6)), o.rot || 0), Object.assign({ closed: true }, o));

  // ===========================================================================
  // Hatching
  // ===========================================================================

  /**
   * hatch(ctx, clip, opts) : parallel pen strokes that build tone inside a shape.
   *   angle        -PI/4    stroke direction (radians): 45 degrees rising left to right
   *   spacing      8        px between rows at full density (art bible: 12 light, 8 mid, 5 dark)
   *   width        1.4      pen width (art bible: 1.2 to 1.8)
   *   color        pal.ink
   *   alpha        0.9
   *   density      1        0..1, or fn(x, y) => 0..1. Rows drop out evenly as density falls and
   *                         stroke ends stagger along the tone edge, like a hand building shade.
   *   length       [16,64]  stroke length range (px)
   *   gap          [2,7]    px between strokes along a row
   *   inset        6        polygons: how far a stroke may stop short of the edge
   *   overshoot    3        polygons: how far a stroke may cross the edge
   *   angleJitter  0.052    per stroke (+-3 degrees)
   *   spacingJitter 0.3     fraction of spacing (+-15 percent)
   *   flow         0.05     slow angle drift across the rows (radians)
   *   bow          0.7      random sideways bow per stroke (px)
   *   bend         0        consistent bow (px), follows a rounded form
   *   taper        0.3      width at the flick end (fraction)
   *   edge         0.12     how ragged the tone edge is (threshold noise)
   *   boilAmp      0.45     endpoint shimmer per boil drawing (px)
   *   clip         false    polygons: also hard-clip to the polygon
   *   bounds       frame    area to fill when clip is a function, Path2D or null
   *   seed         7
   */
  const PHI = 0.6180339887498949;
  function hatch(ctx, clip, o = {}) {
    const shape = shapeOf(clip, o);
    const seed = seedInt(o.seed === undefined ? 7 : o.seed);
    const r = rng(seed);
    const angle = o.angle != null ? o.angle : -Math.PI / 4;
    const spacing = Math.max(0.8, o.spacing || 8);
    const width = o.width != null ? o.width : 1.4;
    const density = o.density != null ? o.density : 1;
    const densFn = typeof density === 'function' ? density : null;
    const len = o.length || [16, 64];
    const gap = o.gap || [2, 7];
    const inset = o.inset != null ? o.inset : 6;
    const over = o.overshoot != null ? o.overshoot : 3;
    const aJ = o.angleJitter != null ? o.angleJitter : 0.052;
    const sJ = o.spacingJitter != null ? o.spacingJitter : 0.3;
    const flow = o.flow != null ? o.flow : 0.05;
    const bow = o.bow != null ? o.bow : 0.7;
    const bend = o.bend || 0;
    const taper = o.taper != null ? o.taper : 0.3;
    const edgeN = o.edge != null ? o.edge : 0.12;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.45;
    const bi = boilIndex(o);
    const minLen = Math.max(2, Math.min(len[0] * 0.35, 6));
    const probe = Math.max(3, Math.min(8, len[0] * 0.4));
    const phase = h3(seed, 3, 9);

    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    const B = shape.bounds;
    const corners = [[B.x, B.y], [B.x + B.w, B.y], [B.x, B.y + B.h], [B.x + B.w, B.y + B.h]];
    let umin = Infinity, umax = -Infinity, vmin = Infinity, vmax = -Infinity;
    for (const c of corners) {
      const u = c[0] * dx + c[1] * dy, v = c[0] * nx + c[1] * ny;
      if (u < umin) umin = u;
      if (u > umax) umax = u;
      if (v < vmin) vmin = v;
      if (v > vmax) vmax = v;
    }

    let edges = null;
    if (shape.polys) {
      edges = [];
      for (const poly of shape.polys) {
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const a = poly[j], b = poly[i];
          edges.push(a[0] * dx + a[1] * dy, a[0] * nx + a[1] * ny, b[0] * dx + b[1] * dy, b[0] * nx + b[1] * ny);
        }
      }
    }

    const paths = [new Path2D(), new Path2D(), new Path2D()];
    const spans = [];
    const on = [];
    const xs = [];
    let strokeId = 0;

    const emit = (u, ue, v, row, dAt) => {
      const sl = ue - u;
      const um = (u + ue) / 2;
      const mx = um * dx + v * nx, my = um * dy + v * ny;
      const ja = aJ * (r() * 2 - 1) + (flow ? flow * noise1(row * 0.09, seed + 5) : 0);
      const bw = bend + bow * (r() * 2 - 1);
      const wv = width * lerp(0.78, 1.18, r()) * lerp(0.72, 1, dAt);
      const p = paths[(r() * 3) | 0];
      const sid = strokeId++;
      const ca = Math.cos(angle + ja), sa = Math.sin(angle + ja);
      const half = sl / 2;
      const jb0 = boilAmp ? (h3(sid, row, bi + seed) - 0.5) * 2 * boilAmp : 0;
      const jb1 = boilAmp ? (h3(row, sid, bi + seed + 9) - 0.5) * 2 * boilAmp : 0;
      const pnx = -sa, pny = ca;
      const x0 = mx - ca * half + pnx * jb0, y0 = my - sa * half + pny * jb0;
      const x1 = mx + ca * (half + jb1 * 0.6) + pnx * jb1, y1 = my + sa * (half + jb1 * 0.6) + pny * jb1;
      const w0 = wv * 0.42, w1 = wv * taper * 0.5, wm = wv * 0.5;
      const k = (w0 + w1) * 0.5;
      const cx = mx + pnx * bw * 2, cy = my + pny * bw * 2;
      p.moveTo(x0 + pnx * w0, y0 + pny * w0);
      p.quadraticCurveTo(cx + pnx * (wm * 2 - k), cy + pny * (wm * 2 - k), x1 + pnx * w1, y1 + pny * w1);
      p.lineTo(x1 - pnx * w1, y1 - pny * w1);
      p.quadraticCurveTo(cx - pnx * (wm * 2 - k), cy - pny * (wm * 2 - k), x0 - pnx * w0, y0 - pny * w0);
      p.closePath();
    };

    const breakUp = (a, b, v, row, dAt) => {
      let u = a;
      while (u < b - minLen) {
        let ue = Math.min(u + lerp(len[0], len[1], r()), b);
        if (b - ue < minLen) ue = b;
        if (ue - u >= minLen) emit(u, ue, v, row, dAt);
        u = ue + lerp(gap[0], gap[1], r());
      }
    };

    let row = 0;
    for (let v0 = vmin + spacing * r(); v0 <= vmax; v0 += spacing, row++) {
      const v = v0 + (r() - 0.5) * spacing * sJ;
      // evenly distributed per-row threshold: rows vanish uniformly as density falls
      const rowTh = ((row * PHI + phase) % 1) * 0.94 + 0.03;
      spans.length = 0;
      if (edges) {
        xs.length = 0;
        for (let e = 0; e < edges.length; e += 4) {
          const va = edges[e + 1], vb = edges[e + 3];
          if ((va > v) !== (vb > v)) xs.push(edges[e] + ((v - va) / (vb - va)) * (edges[e + 2] - edges[e]));
        }
        if (xs.length < 2) continue;
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) spans.push(xs[k], xs[k + 1]);
      } else {
        spans.push(umin, umax);
      }
      if (!densFn && density < rowTh) continue;
      const dConst = densFn ? 1 : clamp(density);
      for (let sp = 0; sp < spans.length; sp += 2) {
        let u0 = spans[sp], u1 = spans[sp + 1];
        if (edges) {
          u0 += lerp(-over, inset, r() * r());
          u1 -= lerp(-over, inset, r() * r());
        } else {
          u0 -= r() * len[1];
        }
        if (u1 - u0 < minLen) continue;
        if (!densFn) {
          breakUp(u0, u1, v, row, dConst);
          continue;
        }
        // walk the row; strokes live where density beats the (slightly noisy) row threshold
        on.length = 0;
        let start = null;
        let dSum = 0, dN = 0;
        for (let u = u0; ; u += probe) {
          const uu = Math.min(u, u1);
          const d = clamp(densFn(uu * dx + v * nx, uu * dy + v * ny));
          const th = rowTh + edgeN * noise1(uu * 0.02 + row * 7.31, seed + 11);
          if (d > th) {
            if (start === null) start = uu;
            dSum += d;
            dN++;
          } else if (start !== null) {
            on.push(start, uu, dSum / dN);
            start = null;
            dSum = dN = 0;
          }
          if (uu >= u1) break;
        }
        if (start !== null) on.push(start, u1, dSum / Math.max(1, dN));
        for (let k = 0; k < on.length; k += 3) {
          // soften where the tone edge cuts a stroke
          const a = on[k] === u0 ? on[k] : on[k] + (r() - 0.5) * probe;
          const b = on[k + 1] === u1 ? on[k + 1] : on[k + 1] + (r() - 0.5) * probe;
          breakUp(a, b, v, row, on[k + 2]);
        }
      }
    }

    ctx.save();
    if (shape.apply && (!shape.polys || o.clip)) shape.apply(ctx);
    ctx.fillStyle = o.color || pal.ink;
    const alpha = o.alpha != null ? o.alpha : 0.9;
    const A = [0.74, 0.88, 1];
    const base = ctx.globalAlpha;
    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = base * alpha * A[k];
      ctx.fill(paths[k]);
    }
    ctx.restore();
  }
  lib.hatch = hatch;

  /**
   * crossHatch(ctx, clip, opts) : layered hatching where each extra layer only covers darker tone.
   *   tone     1       0..1 overall darkness (with no density, 0.25 = one layer, 1 = four)
   *   layers   2 (4 when tone is given)  maximum layer count
   *   density  1 or fn(x,y) => 0..1: local darkness; layer i appears where density*tone*layers > i
   *   angle    -PI/4   first layer angle (45 degrees); later layers turn by opts.turn
   *   turn     [-PI/3, 0.3, -1.35]  offsets for layers 2..4: layer 2 at 105 degrees, 3 and 4 thicken 1 and 2
   *   crossSpacing  spacing*1.4  spacing of layers 2..4 (art bible: 5 px base, 7 px cross)
   *   ...all hatch options
   */
  function crossHatch(ctx, clip, o = {}) {
    const layers = o.layers || (o.tone != null ? 4 : 2);
    const tone = o.tone != null ? clamp(o.tone) : 1;
    const d = o.density != null ? o.density : 1;
    const base = o.angle != null ? o.angle : -Math.PI / 4;
    const turn = o.turn || [-Math.PI / 3, 0.3, -1.35];
    const seed = seedInt(o.seed === undefined ? 11 : o.seed);
    for (let i = 0; i < layers; i++) {
      let dens;
      if (typeof d === 'function') {
        dens = (x, y) => clamp(d(x, y) * tone * layers - i);
      } else {
        dens = clamp(d * tone * layers - i);
        if (dens <= 0) break;
      }
      hatch(
        ctx,
        clip,
        Object.assign({}, o, {
          angle: base + (i === 0 ? 0 : turn[(i - 1) % turn.length]),
          seed: seed + i * 7919,
          density: dens,
          spacing: i === 0 ? o.spacing || 8 : o.crossSpacing || (o.spacing || 8) * 1.4,
        })
      );
    }
  }
  lib.crossHatch = crossHatch;

  // ===========================================================================
  // Stipple
  // ===========================================================================

  /**
   * stipple(ctx, clip, opts) : seeded dots on a jittered hex grid.
   *   spacing  7.5      mean px between dots at density 1 (about 0.02 dots per px2)
   *   r        [1.0, 2.2] dot radius range (bigger where density is higher)
   *   density  1 or fn(x,y) => 0..1
   *   jitter   0.45     fraction of spacing
   *   color    pal.ink
   *   alpha    0.9
   *   boilAmp  0.35     px shimmer per boil drawing
   *   clip     true     polygons: skip dots outside; functions/Path2D always hard-clip
   *   seed     13
   */
  function stipple(ctx, clip, o = {}) {
    const shape = shapeOf(clip, o);
    const seed = seedInt(o.seed === undefined ? 13 : o.seed);
    const sp = Math.max(1, o.spacing || 7.5);
    const rr = o.r || [1.0, 2.2];
    const density = o.density != null ? o.density : 1;
    const densFn = typeof density === 'function' ? density : null;
    const jit = (o.jitter != null ? o.jitter : 0.45) * sp;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.35;
    const bi = boilIndex(o);
    const B = shape.bounds;
    const rowH = sp * 0.866;
    const p = new Path2D();
    const i0 = Math.floor(B.y / rowH) - 1, i1 = Math.ceil((B.y + B.h) / rowH) + 1;
    const j0 = Math.floor(B.x / sp) - 1, j1 = Math.ceil((B.x + B.w) / sp) + 1;
    for (let i = i0; i <= i1; i++) {
      const off = i & 1 ? sp * 0.5 : 0;
      for (let j = j0; j <= j1; j++) {
        const a = h3(i, j, seed);
        const b = h3(j, i, seed + 1);
        const c = h3(i + 7, j - 3, seed + 2);
        let x = j * sp + off + (a - 0.5) * 2 * jit;
        let y = i * rowH + (b - 0.5) * 2 * jit;
        if (x < B.x || x > B.x + B.w || y < B.y || y > B.y + B.h) continue;
        const dAt = densFn ? clamp(densFn(x, y)) : density;
        if (c >= dAt) continue;
        if (shape.polys && !polysContain(shape.polys, x, y)) continue;
        if (boilAmp) {
          x += (h3(i, j, seed + bi * 31 + 5) - 0.5) * 2 * boilAmp;
          y += (h3(j, i, seed + bi * 37 + 6) - 0.5) * 2 * boilAmp;
        }
        const rad = lerp(rr[0], rr[1], clamp(h3(j, i, seed + 3) * 0.55 + dAt * 0.45));
        p.moveTo(x + rad, y);
        p.arc(x, y, rad, 0, TAU);
      }
    }
    ctx.save();
    if (shape.apply && !shape.polys) shape.apply(ctx);
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.9;
    ctx.fillStyle = o.color || pal.ink;
    ctx.fill(p);
    ctx.restore();
  }
  lib.stipple = stipple;

  // ===========================================================================
  // Backgrounds: paper, blueprint, stripes
  // Each fills the frame (FILM.W × FILM.H) unless opts give a rectangle.
  // Plate caches include both width and height, so a second format does not reuse a vertical plate.
  // ===========================================================================

  function renderScale() {
    return FILM.S || 1;
  }

  /**
   * paper(ctx, opts) : cream paper with mottling, grain and fibres. Cached by size, seed and options.
   *   x, y, w, h   0, 0, frame width, frame height
   *   color        pal.paper
   *   seed         3
   *   grain        1      fine grain strength
   *   fibres       1      fibre count multiplier
   *   mottle       1      large soft blotches
   *   vignette     0.35   darkened edges
   */
  function paper(ctx, o = {}) {
    const x = o.x || 0, y = o.y || 0;
    const w = o.w || W(), h = o.h || H();
    const S = renderScale();
    const color = o.color || pal.paper;
    const seed = seedInt(o.seed === undefined ? 3 : o.seed);
    const grain = o.grain != null ? o.grain : 1;
    const fibres = o.fibres != null ? o.fibres : 1;
    const mottle = o.mottle != null ? o.mottle : 1;
    const vignette = o.vignette != null ? o.vignette : 0.35;
    const key = ['paper', w, h, S, color, seed, grain, fibres, mottle, vignette].join('|');
    const c = cached(key, () => makePaper(Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)), S, color, seed, grain, fibres, mottle, vignette));
    ctx.drawImage(c, x, y, w, h);
  }

  function makePaper(cw, ch, S, color, seed, grain, fibres, mottle, vignette) {
    const c = newCanvas(cw, ch);
    const g = c.getContext('2d');
    const [br, bg, bb] = parseColor(color);
    // mottling from a low-resolution noise field, upscaled smooth
    const mw = Math.max(4, Math.ceil(cw / 18)), mh = Math.max(4, Math.ceil(ch / 18));
    const mf = new Float32Array(mw * mh);
    for (let j = 0; j < mh; j++) {
      for (let i = 0; i < mw; i++) {
        mf[j * mw + i] = lib.fbm2(i * 0.11, j * 0.11, seed, 4) * 0.8 + noise2(i * 0.5, j * 0.5, seed + 9) * 0.2;
      }
    }
    const img = g.createImageData(cw, ch);
    const d = img.data;
    const fx = (mw - 1) / cw, fy = (mh - 1) / ch;
    const cxv = cw / 2, cyv = ch / 2;
    const vr = Math.hypot(cxv, cyv);
    for (let py = 0; py < ch; py++) {
      const my = py * fy;
      const jy = Math.floor(my), ty = my - jy;
      const jy1 = Math.min(mh - 1, jy + 1);
      for (let px = 0; px < cw; px++) {
        const mx = px * fx;
        const ix = Math.floor(mx), tx = mx - ix;
        const ix1 = Math.min(mw - 1, ix + 1);
        const m =
          lerp(lerp(mf[jy * mw + ix], mf[jy * mw + ix1], tx), lerp(mf[jy1 * mw + ix], mf[jy1 * mw + ix1], tx), ty);
        const n = h3(px, py, seed + 77);
        const n2 = h3(px >> 1, py >> 1, seed + 78);
        const gr = ((n - 0.5) * 0.6 + (n2 - 0.5) * 0.4) * 0.07 * grain;
        const dxv = (px - cxv) / vr, dyv = (py - cyv) / vr;
        const vig = vignette * Math.max(0, dxv * dxv + dyv * dyv - 0.35) * 0.18;
        const k = 1 + m * 0.055 * mottle + gr - vig;
        const i = (py * cw + px) * 4;
        // darker areas go slightly warmer, like aged paper
        d[i] = br * k;
        d[i + 1] = bg * (k - (1 - k) * 0.12);
        d[i + 2] = bb * (k - (1 - k) * 0.35);
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    // fibres
    const r = rng(seed + 5);
    const count = Math.round(((cw * ch) / (S * S)) / 1500 * fibres);
    const dark = new Path2D(), light = new Path2D();
    for (let i = 0; i < count; i++) {
      const x = r() * cw, y = r() * ch;
      const L = r.range(5, 26) * S * (r() < 0.08 ? 2.5 : 1);
      const a = r() * TAU;
      const bend = r.range(-0.5, 0.5) * L;
      const p = r() < 0.55 ? dark : light;
      const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
      p.moveTo(x, y);
      p.quadraticCurveTo((x + ex) / 2 - Math.sin(a) * bend, (y + ey) / 2 + Math.cos(a) * bend, ex, ey);
    }
    g.lineCap = 'round';
    g.lineWidth = 0.7 * S;
    g.strokeStyle = lib.rgba(pal.inkSoft, 0.07);
    g.stroke(dark);
    g.lineWidth = 1.1 * S;
    g.strokeStyle = 'rgba(255,252,242,0.22)';
    g.stroke(light);
    // specks and faint foxing spots
    const specks = new Path2D();
    for (let i = 0; i < count * 0.08; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(0.3, 1.1) * S;
      specks.moveTo(x + rad, y);
      specks.arc(x, y, rad, 0, TAU);
    }
    g.fillStyle = lib.rgba(pal.inkSoft, 0.22);
    g.fill(specks);
    for (let i = 0; i < 6 * mottle; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(30, 120) * S;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, lib.rgba(pal.paperDeep, 0.07));
      gr.addColorStop(1, lib.rgba(pal.paperDeep, 0));
      g.fillStyle = gr;
      g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    return c;
  }
  lib.paper = paper;

  /**
   * blueprint(ctx, opts) : navy plate with faint grid, big guide circles, long diagonals and noise.
   * Cached by size, seed and options.
   *   x, y, w, h   0, 0, frame width, frame height
   *   color        pal.navy
   *   seed         5
   *   grid         60      grid pitch (px); 0 turns the grid off
   *   major        5       every Nth grid line is stronger
   *   center       [0.5w, 0.44h]  centre of the guide circles
   *   circles      4
   *   diagonals    5
   *   noise        1
